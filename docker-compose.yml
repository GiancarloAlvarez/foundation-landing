services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fumablac
      POSTGRES_PASSWORD: fumablac_dev
      POSTGRES_DB: fumablac
    ports:
      - "5433:5432"
    volumes:
      - fumablac_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fumablac"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fumablac_pgdata:
